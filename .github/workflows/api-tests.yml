name: API Tests

# Fastify API 패키지(@living-cost-manager/api)의 Vitest 통합 테스트.
# DB 연동 테스트는 GitHub-hosted runner의 PostgreSQL service 컨테이너에서 실행되며,
# apps/api/tests/test-database.ts의 test-isolation 검사(DB/schema 이름에 test 포함)를 통과하는
# 격리 URL만 주입합니다. 프로덕션/staging DB URL은 절대 이 워크플로우에 노출하지 않습니다.
#
# 참고: mac-mini-runner(self-hosted)는 sanghyun-io/harudo 저장소 전용으로 등록되어 있어
# 이 저장소의 job을 받을 수 없습니다. ubuntu-latest(GitHub-hosted)를 사용하세요.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lcm_test
          POSTGRES_PASSWORD: lcm_test
          POSTGRES_DB: lcm_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # setup-test-db.ts가 이 URL로 `prisma migrate reset --force`를 실행해
      # lcm_test DB를 매번 새로 만듭니다. 로컬(pnpm test:api)과 동일한 값입니다.
      - name: Run API tests
        env:
          API_TEST_DATABASE_URL: postgresql://lcm_test:lcm_test@localhost:5433/lcm_test?schema=lcm_test
        run: pnpm --filter @living-cost-manager/api test
