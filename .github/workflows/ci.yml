name: CI (Mac Mini self-hosted)

# 전사 CI/CD 기준(policies/ci-cd-github-actions-macmini-runner-policy.md)에 따른
# Living Cost Manager 저장소 전용 self-hosted 워크플로다. GitHub-hosted Linux
# 우회는 금지이며, 비신뢰 코드(fork·PR 자동 실행·이슈 콘텐츠)는 이 워크플로로
# 실행되지 않는다.
#
# Trust model (2026-10-16 재작성):
#   - 트리거는 push-to-main 뿐: main에는 Owner 신뢰 push만 들어오고(브랜치
#     보호: force-push·삭제 금지), 병합 전 독립 리뷰를 거친다. fork는 이
#     저장소 main에 push할 수 없다. PR/dispatch/input 경로는 없다.
#   - workflow_dispatch 제거: 상시 실행되는 프로덕션 runner에서 임의
#     브랜치 코드를 실행하는 경로 차단. 특정 커밋 재실행은 feature branch →
#     리뷰 → main 머지로 수행.
#   - checkout은 event SHA 고정 + persist-credentials: false.
#   - 배포 산출물: 이 워크플로가 프로덕션 API origin으로 정적 FE를 빌드하고
#     아티팩트(lcm-release-<sha>)로 올린다. deploy-pages.yml은 재빌드 없이
#     같은 run의 아티팩트만 검증·배포한다(build-info.json + content digest,
#     scripts/ci/release-gate.mjs). API base URL은 퍼블릭 값이라 CI에서
#     bake하는 것이 시크릿과 무관하다.
#
# runs-on 라벨 4종은 job 라우팅 조건일 뿐 보안 격리 수단이 아니다. 실제 경계는
# repository-scoped 등록(sanghyun-io/living-cost-manager 전용 runner)과 Mac Mini
# 위의 전용 비관리자 OS 계정(lcm-ci) 실행 격리다.
#
# Action pin: third-party 금지, GitHub 공식 actions만 commit SHA로 고정.
#   actions/checkout@3d3c42e5... = v7.0.1 (release 2026-07-20)
#   actions/setup-node@949feb24... = v7.1.0 (release 2026-10-08)
#   actions/upload-artifact@ea165f8d... = v4.6.2
# pnpm은 서드파티 action 없이 corepack(Node 동봉) + 루트 packageManager
# 필드(pnpm@11.1.3)로 활성화한다. Actions cache는 재현성과 저장소 캐시 잔존
# 회피를 위해 사용하지 않는다.

on:
  push:
    branches: [main]
  # workflow_dispatch intentionally absent — see trust model above.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # Guard job: verifies this workflow run is for the correct repo/ref/event/SHA
  # (defense-in-depth against trigger/branch misconfiguration).
  preflight:
    name: Preflight security checks
    runs-on: [self-hosted, macOS, ARM64, lcm-production]
    timeout-minutes: 5
    steps:
      - name: Verify repository identity
        run: |
          set -eu
          if [ "${{ github.repository }}" != "sanghyun-io/living-cost-manager" ]; then
            echo "error: wrong repository: ${{ github.repository }}" >&2
            exit 1
          fi
          echo "✓ repository: ${{ github.repository }}"

      - name: Verify ref is protected main
        run: |
          set -eu
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "error: ref is not main: ${{ github.ref }}" >&2
            exit 1
          fi
          echo "✓ ref: ${{ github.ref }}"

      - name: Verify event is push (not pull_request, workflow_dispatch, etc.)
        run: |
          set -eu
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "error: event is not push: ${{ github.event_name }}" >&2
            exit 1
          fi
          echo "✓ event: ${{ github.event_name }}"

      - name: Verify SHA is exact event SHA (no ref manipulation)
        run: |
          set -eu
          if [ "${{ github.sha }}" != "${{ github.event.head_commit.id }}" ]; then
            echo "error: SHA mismatch: github.sha=${{ github.sha }} != head_commit.id=${{ github.event.head_commit.id }}" >&2
            exit 1
          fi
          echo "✓ SHA: ${{ github.sha }}"

  build-test:
    name: Build + tests (ephemeral test Postgres)
    needs: [preflight]
    runs-on: [self-hosted, macOS, ARM64, lcm-production]
    timeout-minutes: 40
    permissions:
      contents: read
      # NOTE(리뷰 P2): actions/upload-artifact 시크릿 업로드는 저장소 REST
      # `actions: write` 스코프가 아니라 Actions 런타임의 artifact service
      # 어서셔로 동작한다 — 빌드 잡에 API 쓰기 권한을 주지 않는다. 첫 실런에서
      # 업로드 권한 오류가 실증되면(오류 본문 근거)에만 최소 `actions: write`를
      # 이 job에 재선언하고 근거를 문서에 남긴다.
    steps:
      - name: Checkout exact event SHA (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # fetch-depth: 0 (full history) is required because the
          # product-tour-migration legacy-compatibility test runs
          # `git show 260c8d4:prisma/schema.prisma`. The repo history is
          # small (~210 commits) and this is a trusted Owner-pushed main, so
          # fetching history adds negligible size. Checked-out SHA stays pinned
          # to github.sha (see preflight), so the trust model is unchanged.
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node (pinned exact 24.18.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0

      - name: Activate pnpm via corepack
        run: corepack enable pnpm && pnpm --version

      - name: Install dependencies (frozen lockfile, official npm)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build all workspaces (shared tsc, api tsc, web esbuild+Next export)
        run: pnpm -r --if-present build

      - name: Typecheck web
        run: pnpm --filter @living-cost-manager/web typecheck

      - name: Start ephemeral test Postgres (Unix socket, peer auth, no TCP)
        run: node scripts/ci/ephemeral-postgres.mjs start --github-env "$GITHUB_ENV"

      - name: Run shared package tests
        run: node scripts/ci/run-workspace-vitest.mjs packages/shared

      - name: Run web unit tests (jsdom, no GUI/browser)
        run: node scripts/ci/run-workspace-vitest.mjs apps/web node scripts/bundle-coach-worker.mjs

      - name: Run API integration tests against the ephemeral cluster
        run: node scripts/ci/run-workspace-vitest.mjs apps/api tsx tests/setup-test-db.ts

      - name: Run marketing script tests
        run: pnpm test:marketing

      - name: Run CI runner kit tests (behavioural, fixture trees only, no root)
        working-directory: apps/web
        run: pnpm exec vitest run --root ../../scripts/ci/runner
        # The kit tests exec real bash against fixture trees under a temp dir
        # and run the official package proof only when the pinned tarball is
        # pre-cached on the host (skipped otherwise). No system paths, no
        # network, no registration.

      # verify:pricing·public-smoke·브라우저 스크립트는 운영자 로컬 검증으로 유지
      # (Playwright browser 바이너리/pwsh 의존 → CI 계정 홈에 다운로드하지 않는다;
      # §docs/ci-self-hosted-runner-20261016.md §3).

      # ---- release artifact handoff (deploy는 이 아티팩트를 그대로 배포) ----
      - name: Build static FE for the production API origin (exact SHA)
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.gamja.top/living-cost-manager/v1
        run: pnpm --filter "@living-cost-manager/web..." build

      - name: Write release metadata + gated build info
        run: |
          set -eu
          node scripts/write-release-meta.mjs "$GITHUB_SHA"
          mkdir -p dist-release
          cp -R apps/web/out dist-release/out
          # workflow identity: display name is forgeable — bind the SOURCE
          # FILE PATH (exact constant) into build-info; the numeric workflow
          # id is enforced by the deploy gate against the fixed-path metadata.
          node scripts/ci/release-gate.mjs write \
            --out-dir dist-release/out \
            --info dist-release/build-info.json \
            --workflow-path .github/workflows/ci.yml

      - name: Upload release artifact (name pins the exact SHA)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcm-release-${{ github.sha }}
          path: dist-release
          if-no-files-found: error
          retention-days: 7

      # 클린업은 마지막 `if: always()` 단계에서 수행한다. 이전 단계가 실패해도
      # 항상 실행되며, stop 스크립트는 자기 state 파일/PID가 아닌 프로세스에는
      # 손대지 않는다(스크립트 상단 안전 규칙 참조).
      - name: Stop ephemeral test Postgres (cleanup, always)
        if: always()
        run: node scripts/ci/ephemeral-postgres.mjs stop || true
